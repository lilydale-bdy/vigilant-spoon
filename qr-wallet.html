<title>Lilydale Bdy — QR</title>

<meta name="apple-mobile-web-app-capable" content="yes" />

<meta name="apple-mobile-web-app-title" content="Lilydale QR" />

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: #080c0d;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding: 24px 20px;
    gap: 0;
  }

  .brand {
    text-align: center;
    margin-bottom: 28px;
  }

  .brand-name {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 5px;
    color: #ffffff;
    text-transform: uppercase;
  }

  .brand-rule {
    width: 120px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #3fa9bd, transparent);
    margin: 10px auto 8px;
  }

  .brand-tagline {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2.5px;
    color: #3fa9bd;
    text-transform: uppercase;
  }

  .qr-card {
    background: #ffffff;
    border-radius: 20px;
    padding: 18px;
    box-shadow: 0 0 0 1px rgba(63,169,189,0.3), 0 20px 60px rgba(0,0,0,0.7);
  }

  .qr-card img {
    display: block;
    width: min(280px, 78vw);
    height: min(280px, 78vw);
  }

  .scan-label {
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #4a6060;
    text-transform: uppercase;
    margin-top: 14px;
  }

  .open-link {
    display: inline-block;
    margin-top: 28px;
    padding: 14px 32px;
    background: linear-gradient(145deg, #3fa9bd, #216778);
    color: #ffffff;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    text-decoration: none;
    border-radius: 50px;
    box-shadow: 0 8px 24px rgba(33,103,120,0.4);
  }

  .contact-row {
    display: flex;
    gap: 20px;
    margin-top: 24px;
  }

  .contact-item {
    text-align: center;
  }

  .contact-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #4a6060;
    text-transform: uppercase;
    display: block;
    margin-bottom: 3px;
  }

  .contact-value {
    font-size: 12px;
    font-weight: 600;
    color: #3fa9bd;
  }
</style>
</head>
